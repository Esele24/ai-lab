# Keeps the Render backend awake.
#
# WHY THIS EXISTS
# The free Render instance sleeps after ~15 minutes with no traffic. Waking it
# takes most of a minute, and /api/data/ask already runs 33-55s warm because it
# makes two model calls. Cold, the total crosses the Vercel proxy's ceiling and
# the visitor gets a 502 — which is what happened on 2026-08-13.
#
# A request every 10 minutes keeps the instance up, so the first real visitor
# gets the warm path instead of paying the wake cost.
#
# WHY GITHUB ACTIONS AND NOT VERCEL CRON
# Vercel's Hobby plan runs cron jobs at most once per day, which is useless
# against a 15-minute sleep timer. Actions is free on a public repo and runs
# whether or not Esele's laptop is on.
#
# ⚠️ TWO LIMITS WORTH KNOWING
#  1. GitHub disables scheduled workflows on a repo with no commits for 60 days.
#     If 502s come back months from now, check this workflow is still enabled.
#  2. Scheduled runs are best-effort and can be delayed under load, so treat the
#     interval as "roughly every 10 minutes", not a guarantee.

name: Keep backend warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # so it can be triggered by hand to wake the backend before a demo

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the dashboard endpoint
        run: |
          # --max-time 90 because a cold start legitimately takes ~60s; a shorter
          # timeout would abort the very wake-up this job exists to perform.
          # -f makes curl exit non-zero on an HTTP error, so a broken backend
          # shows as a failed run rather than a green tick over a 502.
          curl -fsS --max-time 90 \
            https://ai-lab-backend-hhrb.onrender.com/api/dashboard \
            -o /dev/null -w 'status=%{http_code} time=%{time_total}s\n'
